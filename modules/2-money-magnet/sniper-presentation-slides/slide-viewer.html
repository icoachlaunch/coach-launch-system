<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach Launch — Slide Viewer</title>
  <!--
    ══════════════════════════════════════════════════════════════════════
    COACH LAUNCH · THE PRESENTATION ENGINE™ · SLIDE VIEWER
    A single-file HTML deck player. Built for the Sniper Presentation™.
    ══════════════════════════════════════════════════════════════════════

    HOW TO USE:
      1. Set DECK_TITLE below to your presentation's name.
      2. Paste your slides into the SLIDES array (The Presentation Engine™
         does this for you) — one entry per slide.
      3. Save the file and DOUBLE-CLICK it to open in any browser.
         No server, no internet, no install needed.

    EACH SLIDE:
      {
        type:  'html',                 // keep 'html'
        label: 'Short title',          // shows in the drawer + counter
        phase: 'Phase 1 · WHO',        // optional — groups the run sheet
        act:   'Serendipity',          // optional — SCORE™ act / beat
        notes: 'What you SAY here…',    // optional — presenter-only speaker script
        html:  `<full slide HTML>`     // the slide itself (a complete document)
      }

    CONTROLS (audience screen):
      ← →  or  Space   navigate        F   fullscreen / present
      S    speaker notes panel (on THIS screen — use in rehearsal)
      P    pop out a Presenter View window (for a second screen)
      T    start / pause the timer       R   reset the timer
      ☰    all-slides drawer             Esc  close panels
    ══════════════════════════════════════════════════════════════════════
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Coach Launch chrome — crimson accent; slides carry their own brand. */
      --bg:      #0b0b0c;
      --panel:   rgba(20,20,22,0.94);
      --line:    rgba(255,255,255,0.14);
      --accent:  #db0063;          /* Coach Launch crimson */
      --accent-deep: #a80049;
      --muted:   rgba(255,255,255,0.55);
      --ink:     #ffffff;
      --font-display: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
      --font-body:    'Lato', 'Segoe UI', system-ui, sans-serif;
      --transition: 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: var(--font-body);
      overflow: hidden;
      color: #fff;
    }

    /* ── SLIDE STAGE ── */
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

    .slide {
      position: absolute;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transform: scale(0.97) translateY(18px);
      transition: opacity var(--transition), transform var(--transition);
      pointer-events: none;
    }
    .slide.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: all; }
    .slide.exit-left  { opacity: 0; transform: scale(0.96) translateX(-40px); }
    .slide.exit-right { opacity: 0; transform: scale(0.96) translateX(40px); }

    .slide iframe { width: 100%; height: 100%; border: none; background: var(--bg); }
    .slide img {
      max-width: 100%; max-height: 100%; width: auto; height: auto;
      object-fit: contain; display: block; aspect-ratio: 16/9;
    }
    @media (min-aspect-ratio: 16/9) { .slide img { height: 100vh; width: auto; } }
    @media (max-aspect-ratio: 16/9) { .slide img { width: 100vw; height: auto; } }

    /* ── TOP BAR ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 48px;
      background: linear-gradient(to bottom, rgba(11,11,12,0.95), transparent);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 100; opacity: 0; transition: opacity 0.3s;
    }
    #topbar.visible { opacity: 1; }
    #deck-title { font-family: var(--font-display); font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.9); }
    #deck-title .cl { color: var(--accent); }
    #topbar-right { display: flex; align-items: center; gap: 16px; }
    #clock { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
    #clock.running { color: var(--accent); }
    #slide-counter { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; }
    #slide-counter span { color: #fff; font-weight: 800; }

    /* ── BOTTOM NAV ── */
    #bottomnav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
      background: linear-gradient(to top, rgba(11,11,12,0.98), transparent);
      display: flex; align-items: center; justify-content: center; gap: 14px;
      z-index: 100; opacity: 0; transition: opacity 0.3s;
    }
    #bottomnav.visible { opacity: 1; }

    .nav-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid var(--line); background: rgba(255,255,255,0.06);
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; backdrop-filter: blur(8px);
    }
    .nav-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.1); }
    .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }

    #dot-track { display: flex; align-items: center; gap: 5px; max-width: 44vw; flex-wrap: nowrap; overflow: hidden; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.22); cursor: pointer; transition: all 0.25s; flex-shrink: 0; }
    .dot.active { background: var(--accent); width: 22px; border-radius: 4px; box-shadow: 0 0 8px rgba(219,0,99,0.6); }
    .dot:hover:not(.active) { background: rgba(255,255,255,0.55); transform: scale(1.3); }

    .util-btn {
      height: 36px; min-width: 36px; padding: 0 10px; border-radius: 8px;
      border: 1.5px solid var(--line); background: rgba(255,255,255,0.05);
      color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s; backdrop-filter: blur(8px); letter-spacing: .04em;
    }
    .util-btn:hover { border-color: var(--accent); color: #fff; }
    .util-btn.on { border-color: var(--accent); color: #fff; background: rgba(219,0,99,0.22); }

    /* ── SPEAKER NOTES PANEL (in-window, this screen) ── */
    #notes-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 250;
      background: var(--panel); border-top: 3px solid var(--accent);
      backdrop-filter: blur(20px); padding: 16px 22px 20px;
      max-height: 42vh; overflow-y: auto;
      transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    #notes-panel.open { transform: translateY(0); }
    #notes-panel .np-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    #notes-panel .np-beat { font-family: var(--font-display); font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    #notes-panel .np-next { font-size: 12px; color: var(--muted); }
    #notes-panel .np-next b { color: #fff; }
    #notes-panel .np-body { font-size: clamp(15px, 1.5vw, 19px); line-height: 1.6; color: #f2f2f4; white-space: pre-wrap; }
    #notes-panel .np-body.empty { color: var(--muted); font-style: italic; }
    #notes-panel .np-close { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px; }
    #notes-panel .np-close:hover { color:#fff; border-color: var(--accent); }

    /* ── THUMBNAIL / RUN-SHEET DRAWER ── */
    #drawer-toggle {
      position: fixed; right: 20px; bottom: 72px; width: 44px; height: 44px; border-radius: 12px;
      border: 2px solid var(--line); background: rgba(20,20,22,0.85); color: #fff; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 200;
      transition: all 0.2s; backdrop-filter: blur(10px); opacity: 0;
    }
    #drawer-toggle.visible { opacity: 1; }
    #drawer-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }

    #drawer {
      position: fixed; right: 0; top: 0; bottom: 0; width: 264px;
      background: var(--panel); border-left: 1px solid var(--line); backdrop-filter: blur(20px);
      z-index: 300; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto; padding: 54px 12px 20px;
    }
    #drawer.open { transform: translateX(0); }
    #drawer-close {
      position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 8px;
      border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    #drawer-close:hover { color: #fff; border-color: var(--accent); }
    #drawer h3 { font-family: var(--font-display); font-size: 10px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.75); margin-bottom: 14px; padding-left: 4px; }
    .phase-head { font-family: var(--font-display); font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 14px 0 6px; padding-left: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
    .phase-head:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }

    .thumb-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-bottom: 4px; }
    .thumb-item:hover { background: rgba(255,255,255,0.06); }
    .thumb-item.active { background: rgba(219,0,99,0.18); border: 1px solid var(--line); }
    .thumb-tile {
      width: 46px; height: 30px; border-radius: 5px; flex-shrink: 0;
      background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.7);
    }
    .thumb-item.active .thumb-tile { border-color: var(--accent); color: #fff; }
    .thumb-label { font-size: 11px; line-height: 1.35; color: rgba(255,255,255,0.72); }

    /* ── HINTS / PROGRESS / LABEL ── */
    #keyhint { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); font-size: 10px; color: rgba(255,255,255,0.28); letter-spacing: 0.08em; pointer-events: none; z-index: 50; transition: opacity 0.5s; }
    #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 500; transition: width 0.4s ease; box-shadow: 0 0 10px rgba(219,0,99,0.6); }
    #slide-label { position: fixed; bottom: 72px; left: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: rgba(255,255,255,0.42); z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
    #slide-label.visible { opacity: 1; }
    #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(20,20,22,0.95); border: 1px solid var(--line); border-left: 3px solid var(--accent); color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 8px; z-index: 600; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #toast.show { opacity: 1; }

    /* ── EDGE CLICK ZONES ── */
    .swipe-zone { position: fixed; top: 48px; bottom: 64px; width: 70px; z-index: 50; cursor: pointer; }
    #swipe-left { left: 0; } #swipe-right { right: 0; }
  </style>
</head>
<body>

<div id="progress-bar"></div>

<div id="topbar">
  <div id="deck-title"></div>
  <div id="topbar-right">
    <div id="clock" title="Timer — T start/pause, R reset">00:00</div>
    <div id="slide-counter"><span id="cur-num">1</span> / <span id="total-num"></span></div>
  </div>
</div>

<div id="stage"></div>

<div id="bottomnav">
  <button class="nav-btn" id="prev-btn" title="Previous (←)">&#8592;</button>
  <div id="dot-track"></div>
  <button class="nav-btn" id="next-btn" title="Next (→)">&#8594;</button>
  <button class="util-btn" id="notes-btn" title="Speaker notes on this screen (S)">&#9998; Notes</button>
  <button class="util-btn" id="presenter-btn" title="Pop out Presenter View (P)">&#9707; Present</button>
  <button class="util-btn" id="fs-btn" title="Fullscreen (F)">&#9974;</button>
</div>

<div id="notes-panel">
  <div class="np-head">
    <span class="np-beat" id="np-beat"></span>
    <span class="np-next" id="np-next"></span>
    <button class="np-close" id="np-close">Close (S)</button>
  </div>
  <div class="np-body" id="np-body"></div>
</div>

<div id="slide-label"></div>
<div id="keyhint">&larr; &rarr; move &nbsp;&middot;&nbsp; F present &nbsp;&middot;&nbsp; S notes &nbsp;&middot;&nbsp; P presenter view &nbsp;&middot;&nbsp; T timer</div>
<div id="toast"></div>

<button id="drawer-toggle" title="All slides / run sheet">&#9776;</button>
<div id="drawer">
  <button id="drawer-close">&times;</button>
  <h3>Run Sheet</h3>
  <div id="thumb-list"></div>
</div>

<div class="swipe-zone" id="swipe-left"></div>
<div class="swipe-zone" id="swipe-right"></div>

//             to the audience. Pulls straight from your Sniper Presentation™ Script.

Every slide's notes explain what that beat does in a real Sniper Presentation™ — so this deck doubles as a walkthrough of the plan table.

WHEN YOU BUILD YOUR OWN, this cover is replaced by slide 1: your MC intro and price anchor. If you supply a founder photo it uses 02-intro-split; if you do not, it stays on this centred cover. `,

  { type:'html', label:"The $Million Promise™", phase:"Phase 1 · WHO", act:"Serendipity",
    notes:` BEAT 2 — THE HOOK + YOUR $Million Promise™.

Your promise goes on this slide exactly as you locked it in Step 1. Not a shortened version, not a punchier rewrite — verbatim. The builder will refuse to reword it, and that is deliberate: this line was tested upstream.

Say it out loud as a question the room can answer: how many of you want [outcome] without [obstacle]? Then ask for a response — drop a YES in the chat, hands up in the room. The first engagement moment sets the tone for the whole event. `,

  { type:'html', label:"Who this is for", phase:"Phase 1 · WHO", act:"Serendipity",
    notes:` BEAT 3 — WHO THIS IS FOR.

A binary. Name your Golden Avatar™ specifically enough that the right people lean in — and give the wrong ones permission to drop off. That second half matters more than it looks: a room with the wrong people in it drags every engagement beat down.

This mold holds up to five items per column. If your Script has more, the builder stops and shows you, rather than quietly cutting one. `,
    html:` <!DOCTYPE html><html data-surface="L"><head><meta charset="utf-8">

// ══════════════════════════════════════════════════════════════════════
//  (Viewer engine below — you don't need to edit anything past this line.)
// ══════════════════════════════════════════════════════════════════════

const slides = SLIDES;
let current = 0, uiTimer = null;

const stage = document.getElementById('stage');
const dotTrack = document.getElementById('dot-track');
const thumbList = document.getElementById('thumb-list');
const topbar = document.getElementById('topbar');
const bottomnav = document.getElementById('bottomnav');
const drawerToggle = document.getElementById('drawer-toggle');
const slideLabel = document.getElementById('slide-label');
const progressBar = document.getElementById('progress-bar');
const curNum = document.getElementById('cur-num');
const totalNum = document.getElementById('total-num');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const drawer = document.getElementById('drawer');
const notesPanel = document.getElementById('notes-panel');
const clockEl = document.getElementById('clock');
const toastEl = document.getElementById('toast');

document.getElementById('deck-title').innerHTML = '<span class="cl">Coach Launch</span> &middot; ' + escapeHtml(DECK_TITLE);
document.title = DECK_TITLE;
totalNum.textContent = slides.length;

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function labelOf(i){ return slides[i] ? (slides[i].label || ('Slide ' + (i+1))) : ''; }
function notesOf(i){ return slides[i] && slides[i].notes ? slides[i].notes : ''; }
function beatOf(i){ const s = slides[i]||{}; return [s.phase, s.act].filter(Boolean).join('  ·  '); }

/* ── build slides ── */
slides.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (i === 0 ? ' active' : '');
  el.dataset.index = i;
  el.dataset.type = s.type || 'html';
  if ((s.type || 'html') === 'html') {
    const iframe = document.createElement('iframe');
    iframe.sandbox = 'allow-scripts allow-same-origin';
    if (s.html) iframe.srcdoc = s.html; else iframe.src = s.url;
    iframe.title = labelOf(i);
    if (i > 1) iframe.loading = 'lazy';
    el.appendChild(iframe);
  } else {
    const img = document.createElement('img');
    img.src = s.url; img.alt = labelOf(i); img.loading = i < 3 ? 'eager' : 'lazy';
    el.appendChild(img);
  }
  stage.appendChild(el);
});

/* ── dots ── */
slides.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.title = labelOf(i);
  dot.addEventListener('click', () => goTo(i));
  dotTrack.appendChild(dot);
});

/* ── run-sheet drawer (grouped by phase) ── */
let lastPhase = null;
slides.forEach((s, i) => {
  if ((s.phase || '') !== lastPhase) {
    lastPhase = s.phase || '';
    if (lastPhase) {
      const ph = document.createElement('div');
      ph.className = 'phase-head';
      ph.textContent = lastPhase;
      thumbList.appendChild(ph);
    }
  }
  const item = document.createElement('div');
  item.className = 'thumb-item' + (i === 0 ? ' active' : '');
  item.dataset.index = i;
  item.innerHTML = '<div class="thumb-tile">' + String(i+1).padStart(2,'0') + '</div><div class="thumb-label">' + escapeHtml(labelOf(i)) + '</div>';
  item.addEventListener('click', () => { goTo(i); closeDrawer(); });
  thumbList.appendChild(item);
});

/* ── navigation ── */
function goTo(n) {
  if (n < 0 || n >= slides.length) return;
  const slideEls = stage.querySelectorAll('.slide');
  const dots = dotTrack.querySelectorAll('.dot');
  const thumbs = thumbList.querySelectorAll('.thumb-item');

  slideEls[current].classList.remove('active');
  slideEls[current].classList.add(n > current ? 'exit-left' : 'exit-right');
  const prevIdx = current;
  setTimeout(() => slideEls[prevIdx].classList.remove('exit-left', 'exit-right'), 500);
  dots[current].classList.remove('active');
  thumbs.forEach(t => { if (+t.dataset.index === current) t.classList.remove('active'); });

  current = n;

  slideEls[current].classList.add('active');
  dots[current].classList.add('active');
  thumbs.forEach(t => { if (+t.dataset.index === current) { t.classList.add('active'); t.scrollIntoView({ block:'nearest', behavior:'smooth' }); } });

  curNum.textContent = current + 1;
  progressBar.style.width = ((current + 1) / slides.length * 100) + '%';
  slideLabel.textContent = String(current+1).padStart(2,'0') + ' — ' + labelOf(current);
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;

  updateNotes();
  updatePresenter();

  const activeSlideEl = slideEls[current];
  if (activeSlideEl.dataset.type === 'html') {
    const iframe = activeSlideEl.querySelector('iframe');
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type:'slide-active', index: current }, '*');
  }
}
function next() { goTo(current + 1); }
function prev() { goTo(current - 1); }
prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', next);

/* ── speaker notes panel (this screen) ── */
function updateNotes() {
  const beat = beatOf(current);
  document.getElementById('np-beat').textContent = beat || labelOf(current);
  const nx = current < slides.length - 1 ? labelOf(current+1) : '— end —';
  document.getElementById('np-next').innerHTML = 'Next: <b>' + escapeHtml(nx) + '</b>';
  const body = document.getElementById('np-body');
  const n = notesOf(current);
  body.textContent = n || 'No speaker notes on this slide.';
  body.classList.toggle('empty', !n);
}
function toggleNotes() { notesPanel.classList.toggle('open'); document.getElementById('notes-btn').classList.toggle('on', notesPanel.classList.contains('open')); }
document.getElementById('notes-btn').addEventListener('click', toggleNotes);
document.getElementById('np-close').addEventListener('click', toggleNotes);

/* ── timer ── */
let timerRunning = false, elapsed = 0, tickHandle = null, startStamp = 0;
function fmt(sec){ const m = Math.floor(sec/60), s = sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function renderClock(){ clockEl.textContent = fmt(elapsed); clockEl.classList.toggle('running', timerRunning); if (presenterWin && !presenterWin.closed) { const pc = presenterWin.document.getElementById('p-clock'); if (pc) pc.textContent = fmt(elapsed); } }
function tick(){ elapsed = Math.floor((Date.now() - startStamp)/1000); renderClock(); }
function startTimer(){ if (timerRunning) return; timerRunning = true; startStamp = Date.now() - elapsed*1000; tickHandle = setInterval(tick, 1000); renderClock(); toast('Timer started'); }
function pauseTimer(){ if (!timerRunning) return; timerRunning = false; clearInterval(tickHandle); renderClock(); toast('Timer paused'); }
function toggleTimer(){ timerRunning ? pauseTimer() : startTimer(); }
function resetTimer(){ pauseTimer(); elapsed = 0; renderClock(); toast('Timer reset'); }
clockEl.addEventListener('click', toggleTimer);

function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1400); }

/* ── fullscreen ── */
document.getElementById('fs-btn').addEventListener('click', toggleFullscreen);
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
}

/* ── drawer ── */
document.getElementById('drawer-toggle').addEventListener('click', () => drawer.classList.add('open'));
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
function closeDrawer() { drawer.classList.remove('open'); }

/* ── POP-OUT PRESENTER VIEW (second screen) ──
   Opens a new window that reads this window (opener) directly — works offline
   on file://. Shows big speaker notes, the next-slide preview, phase/act,
   the timer, and prev/next controls. The audience window stays clean. */
let presenterWin = null;
document.getElementById('presenter-btn').addEventListener('click', openPresenter);
function openPresenter() {
  if (presenterWin && !presenterWin.closed) { presenterWin.focus(); return; }
  presenterWin = window.open('', 'CL_Presenter', 'width=1100,height=720');
  if (!presenterWin) { toast('Allow pop-ups to use Presenter View'); return; }
  presenterWin.document.open();
  presenterWin.document.write(presenterShell());
  presenterWin.document.close();
  document.getElementById('presenter-btn').classList.add('on');
  // wire controls once the doc is written
  setTimeout(() => {
    try {
      presenterWin.document.getElementById('p-prev').addEventListener('click', () => window.prev());
      presenterWin.document.getElementById('p-next').addEventListener('click', () => window.next());
      presenterWin.document.getElementById('p-timer').addEventListener('click', () => window.toggleTimer());
      presenterWin.document.addEventListener('keydown', e => {
        if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); window.next(); }
        if (e.key==='ArrowLeft') { e.preventDefault(); window.prev(); }
        if (e.key==='t'||e.key==='T') window.toggleTimer();
      });
      updatePresenter();
      renderClock();
    } catch(err){ /* cross-window timing */ }
  }, 120);
}
function presenterShell() {
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Presenter View — ' + escapeHtml(DECK_TITLE) + '</title>'
  + '<style>'
  + '*{box-sizing:border-box;margin:0;padding:0}'
  + 'body{background:#0b0b0c;color:#fff;font-family:Segoe UI,system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:0}'
  + 'header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.14);background:#141416}'
  + 'header .t{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}'
  + 'header .t b{color:#db0063}'
  + '#p-clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:#db0063;cursor:pointer}'
  + '.main{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;padding:18px 20px;overflow:hidden}'
  + '.col{display:flex;flex-direction:column;min-height:0}'
  + '.kick{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#db0063;margin-bottom:8px}'
  + '#p-beat{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:6px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}'
  + '#p-notes{font-size:22px;line-height:1.55;color:#f2f2f4;white-space:pre-wrap;overflow-y:auto;padding-right:8px;flex:1}'
  + '#p-notes.empty{color:rgba(255,255,255,.4);font-style:italic}'
  + '.preview{background:#000;border:1px solid rgba(255,255,255,.14);border-radius:8px;overflow:hidden;flex:1;position:relative}'
  + '.preview iframe{position:absolute;top:0;left:0;width:200%;height:200%;transform:scale(.5);transform-origin:top left;border:0}'
  + '.nextlabel{margin-top:8px;font-size:13px;color:rgba(255,255,255,.7)}'
  + '.nextlabel b{color:#fff}'
  + 'footer{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px;border-top:1px solid rgba(255,255,255,.14);background:#141416}'
  + 'button{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer}'
  + 'button:hover{background:#db0063;border-color:#db0063}'
  + '#p-counter{font-size:14px;color:rgba(255,255,255,.7);font-weight:700;min-width:70px;text-align:center}'
  + '</style></head><body>'
  + '<header><div class="t"><b>Coach Launch</b> · Presenter View</div><div id="p-clock" title="Click or press T">00:00</div></header>'
  + '<div class="main">'
  +   '<div class="col"><div class="kick">You say (speaker script)</div><div id="p-beat"></div><div id="p-notes"></div></div>'
  +   '<div class="col"><div class="kick">Next slide</div><div class="preview" id="p-preview"></div><div class="nextlabel" id="p-nextlabel"></div></div>'
  + '</div>'
  + '<footer><button id="p-prev">&#8592; Prev</button><span id="p-counter"></span><button id="p-timer">Timer</button><button id="p-next">Next &#8594;</button></footer>'
  + '</body></html>';
}
function updatePresenter() {
  if (!presenterWin || presenterWin.closed) return;
  const d = presenterWin.document;
  const beatEl = d.getElementById('p-beat'); if (!beatEl) return;
  beatEl.textContent = beatOf(current) || labelOf(current);
  const notesEl = d.getElementById('p-notes');
  const n = notesOf(current);
  notesEl.textContent = n || 'No speaker notes on this slide.';
  notesEl.classList.toggle('empty', !n);
  d.getElementById('p-counter').textContent = (current+1) + ' / ' + slides.length;
  // next-slide preview
  const prev = d.getElementById('p-preview');
  const hasNext = current < slides.length - 1;
  prev.innerHTML = '';
  if (hasNext && (slides[current+1].type||'html')==='html' && slides[current+1].html) {
    const f = d.createElement('iframe');
    f.setAttribute('sandbox','allow-scripts allow-same-origin');
    f.srcdoc = slides[current+1].html;
    prev.appendChild(f);
  }
  d.getElementById('p-nextlabel').innerHTML = hasNext ? ('Up next: <b>' + escapeHtml(labelOf(current+1)) + '</b>') : '<b>End of deck</b>';
}

/* expose controls for the presenter window */
window.next = next; window.prev = prev; window.goTo = goTo; window.toggleTimer = toggleTimer;

/* ── keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'Escape') { closeDrawer(); if (notesPanel.classList.contains('open')) toggleNotes(); }
  else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  else if (e.key === 's' || e.key === 'S') toggleNotes();
  else if (e.key === 'p' || e.key === 'P') openPresenter();
  else if (e.key === 't' || e.key === 'T') toggleTimer();
  else if (e.key === 'r' || e.key === 'R') resetTimer();
});

/* ── edges + touch ── */
document.getElementById('swipe-left').addEventListener('click', prev);
document.getElementById('swipe-right').addEventListener('click', next);
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
});

/* ── auto-hide chrome ── */
function showUI() {
  topbar.classList.add('visible'); bottomnav.classList.add('visible');
  drawerToggle.classList.add('visible'); slideLabel.classList.add('visible');
  clearTimeout(uiTimer); uiTimer = setTimeout(hideUI, 3200);
}
function hideUI() {
  if (drawer.classList.contains('open') || notesPanel.classList.contains('open')) return;
  topbar.classList.remove('visible'); bottomnav.classList.remove('visible');
  drawerToggle.classList.remove('visible'); slideLabel.classList.remove('visible');
}
document.addEventListener('mousemove', showUI);
document.addEventListener('click', showUI);

/* ── init ── */
goTo(0);
renderClock();
showUI();
progressBar.style.width = (1 / slides.length * 100) + '%';
</script>
</body>
</html>
